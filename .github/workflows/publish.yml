name: Publish
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check the tag against package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      # Staged publishing needs npm 11.15 or newer.
      - name: Update npm
        run: npm install -g npm@11.19.1

      - name: Build
        run: yarn prepare

      # The staged version goes live once approved on npmjs.com. A version already on npm is skipped.
      - name: Stage with provenance
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on npm, skipping"
          else
            npm stage publish --provenance --access public --ignore-scripts
          fi
