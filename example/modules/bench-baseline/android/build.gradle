plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.benchbaseline'
version = '0.1.0'

android {
  namespace "expo.modules.benchbaseline"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Fresco comes with react-android, whose version the React Native Gradle plugin sets.
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.recyclerview:recyclerview:1.4.0'
}
